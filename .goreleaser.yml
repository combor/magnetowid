version: 2

project_name: magnetowid

release:
  prerelease: auto

before:
  hooks:
    - go mod tidy

builds:
  - id: magnetowid
    main: ./cmd/magnetowid
    binary: magnetowid
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'
        # Waiting for Apple's verdict keeps a rejected binary out of the archives.
        wait: true
        timeout: 20m

archives:
  - id: magnetowid
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip
    # The AUR package installs the systemd files from the archive.
    files:
      - LICENSE
      - README.md
      - src: packaging/linux/magnetowid.{service,sysusers,env}
        dst: systemd
        strip_parent: true

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

nfpms:
  - id: magnetowid
    package_name: magnetowid
    ids:
      - magnetowid
    vendor: combor
    homepage: https://github.com/combor/magnetowid
    maintainer: 'combor <163394+combor@users.noreply.github.com>'
    description: Downloads movies and series from video-on-demand sites for Sonarr and Radarr.
    license: BSD-3-Clause
    section: video
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - ca-certificates
      - ffmpeg
    overrides:
      rpm:
        # Fedora's ffmpeg-free provides the binary but not the ffmpeg name.
        dependencies:
          - ca-certificates
          - /usr/bin/ffmpeg
    rpm:
      signature:
        key_file: '{{ if isEnvSet "GPG_KEY_PATH" }}{{ .Env.GPG_KEY_PATH }}{{ end }}'
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/magnetowid/LICENSE
        packager: rpm
      - src: LICENSE
        dst: /usr/share/doc/magnetowid/copyright
        packager: deb
      - src: packaging/linux/magnetowid.service
        dst: /usr/lib/systemd/system/magnetowid.service
      - src: packaging/linux/magnetowid.sysusers
        dst: /usr/lib/sysusers.d/magnetowid.conf
      - dst: /etc/magnetowid
        type: dir
      - src: packaging/linux/magnetowid.env
        dst: /etc/magnetowid/magnetowid.env
        type: config|noreplace
        file_info:
          mode: 0600
    scripts:
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
      postremove: packaging/linux/postremove.sh

aurs:
  - name: magnetowid-bin
    homepage: https://github.com/combor/magnetowid
    description: Downloads movies and series from video-on-demand sites for Sonarr and Radarr.
    license: BSD-3-Clause
    maintainers:
      - 'combor <163394+combor@users.noreply.github.com>'
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/magnetowid-bin.git'
    skip_upload: auto
    provides:
      - magnetowid
    conflicts:
      - magnetowid
    depends:
      - ca-certificates
      - ffmpeg
    backup:
      - etc/magnetowid/magnetowid.env
    install: packaging/linux/magnetowid.install
    package: |-
      install -Dm755 "./magnetowid" "${pkgdir}/usr/bin/magnetowid"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/magnetowid-bin/LICENSE"
      install -Dm644 "./systemd/magnetowid.service" "${pkgdir}/usr/lib/systemd/system/magnetowid.service"
      install -Dm644 "./systemd/magnetowid.sysusers" "${pkgdir}/usr/lib/sysusers.d/magnetowid.conf"
      install -Dm600 "./systemd/magnetowid.env" "${pkgdir}/etc/magnetowid/magnetowid.env"

homebrew_casks:
  - name: magnetowid
    homepage: https://github.com/combor/magnetowid
    description: Downloads movies and series from video-on-demand sites for Sonarr and Radarr.
    dependencies:
      - formula: ffmpeg
    repository:
      owner: combor
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    skip_upload: auto

scoops:
  - name: magnetowid
    homepage: https://github.com/combor/magnetowid
    description: Downloads movies and series from video-on-demand sites for Sonarr and Radarr.
    license: BSD-3-Clause
    depends:
      - ffmpeg
    repository:
      owner: combor
      name: scoop-bucket
      branch: main
      token: '{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}'
    skip_upload: auto

nix:
  - name: magnetowid
    homepage: https://github.com/combor/magnetowid
    description: Downloads movies and series from video-on-demand sites for Sonarr and Radarr.
    license: bsd3
    main_program: magnetowid
    # The default install script wraps magnetowid with ffmpeg on PATH.
    dependencies:
      - ffmpeg
    extra_install: |-
      install -Dm644 ./LICENSE "$out/share/licenses/magnetowid/LICENSE"
    repository:
      owner: combor
      name: nur
      branch: main
      token: '{{ .Env.NUR_GITHUB_TOKEN }}'
    skip_upload: auto

changelog:
  disable: true
