name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - 'docs/diagrams/**'
      - 'docs/images/**'
      - 'internal/web/static/icon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble site
        run: |
          mkdir -p _site/images
          cp docs/site/* _site/
          cp docs/diagrams/how-it-works.html _site/
          cp docs/images/* internal/web/static/icon.svg _site/images/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
