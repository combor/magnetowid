name: Live Sites

# Detect API changes that fixtures cannot catch.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: TVP, BBC iPlayer, Skyhook and Wikidata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: make live
