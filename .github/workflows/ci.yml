name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: ''
          go-version-file: go.mod
          cache: false

  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Off for tag builds, which publish the release.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Install ffmpeg for download tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -w libx264
      - run: go mod download
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -cover ./...

  container-smoke:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Off for tag builds, which publish the release.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: magnetowid:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and query both APIs
        env:
          MAGNETOWID_SMOKE_IMAGE: magnetowid:ci
        run: go test -count=1 -run TestContainerServesAPIs ./cmd/magnetowid

  integration:
    name: Sonarr & Radarr Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Off for tag builds, which publish the release.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Install ffmpeg to make the test stream
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -w libx264
      - name: Run magnetowid with Sonarr and Radarr
        run: make integration

  package-smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Off for tag builds, which publish the release.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build the packages
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.1
          args: release --snapshot --clean --skip=nix
      - name: Install and run each package as a systemd service
        env:
          MAGNETOWID_SMOKE_DIST: ${{ github.workspace }}/dist
        run: go test -count=1 -timeout 20m -run TestPackageService ./cmd/magnetowid

  lockfile:
    name: Verify Actions Lockfile
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Fails when .github/workflows/actions.lock is out of sync with the
      # workflows, or a locked pin no longer verifies upstream. After adding
      # a workflow or changing a `uses:` line, rerun `gh actions-lock`.
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    name: Workflow Security Lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # 1.32.0 is the first release that reads the lockfile.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: v1.32.0
          advanced-security: false

  release:
    name: Release
    needs:
      - test
      - govulncheck
      - container-smoke
      - integration
      - package-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Allow up to 20 minutes of notarization per macOS binary, plus build/upload.
    timeout-minutes: 60
    # Release credentials belong in this environment, which only v* tags
    # can deploy to.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # GoReleaser needs previous tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Prepare RPM signing key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$RPM_GPG_PRIVATE_KEY" ]; then
            echo "RPM_GPG_PRIVATE_KEY is not configured"
            exit 1
          fi
          umask 077
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/rpm-signing-private.asc"
      # GoReleaser uses nix-hash to generate the Nix package.
      - uses: cachix/install-nix-action@v31.11.4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_PATH: ${{ runner.temp }}/rpm-signing-private.asc
          AUR_KEY: ${{ secrets.AUR_KEY }}
          # Tokens need contents:write on the package repositories.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          NUR_GITHUB_TOKEN: ${{ secrets.NUR_GITHUB_TOKEN }}
          # Without these credentials, macOS binaries ship unsigned.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  publish-container:
    name: Publish Container Image
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Sign the image's build provenance with GitHub's attestation service.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Installing ffmpeg in the arm64 runtime requires emulation.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/combor/magnetowid
          # Prereleases must not move latest.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Anyone can check where the image came from with:
      #   gh attestation verify oci://ghcr.io/combor/magnetowid:TAG -R combor/magnetowid
      - name: Attest the image
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/combor/magnetowid
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Verify the published image is public
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repo=combor/magnetowid
          manifest=$RUNNER_TEMP/ghcr-manifest.json
          if ! curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull" -o "$RUNNER_TEMP/ghcr-token.json"; then
            echo "anonymous pull denied: set the GHCR package to public in its settings, then re-run this job"
            exit 1
          fi
          token=$(jq -r .token "$RUNNER_TEMP/ghcr-token.json")
          curl -fsSL -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/$repo/manifests/$IMAGE_DIGEST" >"$manifest"
          published=$(jq -r '[.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(" ")' "$manifest")
          echo "published: $published"
          [ "$published" = "linux/amd64 linux/arm64" ] || exit 1
