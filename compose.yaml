services:
  magnetowid:
    image: ghcr.io/combor/magnetowid:latest
    restart: unless-stopped
    user: "${MAGNETOWID_UID:-1000}:${MAGNETOWID_GID:-1000}"
    ports:
      - "8484:8484"
    environment:
      MAGNETOWID_API_KEY: "${MAGNETOWID_API_KEY:?Set MAGNETOWID_API_KEY in .env}"
      MAGNETOWID_DOWNLOAD_DIR: /downloads
    volumes:
      - type: bind
        source: ${MAGNETOWID_DOWNLOAD_PATH:-./downloads}
        target: /downloads
        bind:
          create_host_path: false
