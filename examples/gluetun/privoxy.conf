# Edit these paths for your Privoxy installation.
confdir /etc/privoxy
logdir /var/log/privoxy
listen-address 127.0.0.1:8118
permit-access 127.0.0.1
# Forward every destination through Gluetun; do not add direct exceptions.
forward / 127.0.0.1:8888
actionsfile gluetun.action
enable-remote-toggle 0
enable-edit-actions 0
