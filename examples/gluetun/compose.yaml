services:
  gluetun:
    # Replace latest with a release tag or digest to control image updates.
    image: qmcgaw/gluetun:latest
    container_name: magnetowid-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:8484:8484/tcp"
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: "8484"
    volumes:
      - ./wg0.conf:/gluetun/wireguard/wg0.conf:ro
      - state:/gluetun
volumes:
  state:
